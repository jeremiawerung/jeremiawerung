name: Update kartu README

# Kartu stats digambar di sini terus disimpen di repo, soalnya server publik
# github-readme-stats.vercel.app sering mati.
on:
  schedule:
    - cron: "0 0 * * *" # tiap hari jam 07.00 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/grs.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # fail_on_error: kalau API GitHub lagi error, kartu lama yang bener tetep dipakai
      - name: Gambar kartu stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&theme=transparent&hide_border=true&title_color=58A6FF&text_color=C9D1D9"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Gambar kartu top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&theme=transparent&hide_border=true&title_color=58A6FF&text_color=C9D1D9"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit kartu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update kartu stats README" || exit 0
          git push
